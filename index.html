<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RudeBot Web</title>

        <style>
            body {
                background: #111;
                color:#eee;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0;
                padding: 40px 0;
            }


            #log {
                border: 1px solid #444;
                padding: 10px;
                padding-bottom: 80px;
                height: 300px;
                overflow-y: auto;
                background: #222;
            }
            .user { color: #4fc3f7; margin: 8px 0; }
            .bot { color: #f06292; margin: 8px 0; }
            input {
                width: 100%;
                padding: 14px;
                background: #222;
                color: #eee;
                border: none;
                border-radius: 8px;
                font-size: 16px;
                outline: none;
                box-shadow: 0 0 10px rgba(0,0,0,0.4)
            }
            .chat {
                display: flex;
                margin: 10px 0;
            }
            .user-bubble {
                background: #3ea8ff;
                color: #000;
                padding: 12px 16px;
                border-radius: 16px;
                max-width: 75%;
                margin-left: auto;
                font-size: 15px;
            }

            .bot-bubble {
                background: #ff7aa2;
                color: #000;
                padding: 12px 16px;
                border-radius: 16px;
                max-width: 75%;
                margin-right: auto;
                font-size: 15px;
            }
            .typing {
                color: #888;
                font-style: italic;
                margin: 5px 0;
            }
            #input-container {
                margin-top: 10px;
                width: 100%;
                max-width: 570px;
            }
            header {
                background: #1a1a1a;
                padding: 20px;
                text-align: center;
                font-size: 22px;
                border-bottom: 1px solid #333;
                box-shadow: 0 2px rgba(0,0,0,0.4)
            }
            #chat-container {
                background: #1a1a1a;
                border-radius: 12px;
                box-shadow: 0 0 20px rgba(0,0,0,0.4);
                padding: 20px;
                margin-top: 20px;
                height: 70vh;
                width: 100%;
                max-width: 600px;
                display: flex;
                flex-direction: column;
            }
            .chat {
                display: flex;
                margin: 10px 0;
                animation: fadeIn 0.25s ease-out;
            }



            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(4px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
    </head>

    <body>

        <header>RudeBot Web</header>

        <div id="chat-container">

            <div id="log"></div>
            <div id="input-container">
                <input id="msg" placeholder="Say something..." autocomplete="off">
            </div>
        </div>
        <script>
            const sessionId = crypto.randomUUID();
            const backend = "https://rude-backend.onrender.com/chat";

            const log = document.getElementById("log");
            const msg = document.getElementById("msg");

            msg.addEventListener("keydown", async (e) => {
                if (e.key === "Enter") {
                    const text = msg.value.trim();
                    if (!text) return;

                    log.innerHTML += `
                    <div class="chat">
                        <div class="user-bubble">You: ${text}</div>
                    </div>`;
                    msg.value = "";

                    log.innerHTML += `<div id="typing" class="typing">Bot is typing...</div>`;
                    const res = await fetch(backend, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session: sessionId })
                    });

                    const data = await res.json();
                    log.innerHTML += `
                    <div class="chat">
                        <div class="bot-bubble">Bot: ${data.reply}</div>
                    </div>`;
                    log.scrollTop = log.scrollHeight;

                    document.getElementById("typing").remove();
                }
            });
        </script>
    </body>
</html>
