<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RudeBot Web</title>
        <style>
            body {
                background: #111;
                color:#eee;
                font-family: Arial, sans-serif;
                max-width: 600px;
                margin: 40px auto;
            }
            #log {
                border: 1px solid #444;
                padding: 10px;
                padding-bottom: 80px;
                height: 300px;
                overflow-y: auto;
                background: #222;
            }
            .user { color: #4fc3f7; margin: 8px 0; }
            .bot { color: #f06292; margin: 8px 0; }
            input {
                width: 100%;
                padding: 10px;
                margin-top: 10px;
                background: #333;
                color: #eee;
                border: 1px solid #555;
            }
            .chat {
                display: flex;
                margin: 10px 0;
            }
            .user-bubble {
                background: #4fc3f7;
                color: #000;
                padding: 10px;
                border-radius: 10px;
                max-width: 75%;
                margin-left: auto;
            }

            .bot-bubble {
                background: #f06292;
                color: #000;
                padding: 10px;
                border-radius: 10px;
                max-width: 75%;
                margin-right: auto;
            }
            .typing {
                color: #888;
                font-style: italic;
                margin: 5px 0;
            }
            #input-container {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: #111;
                padding: 10px;
                border-top: 1px solid #333;
            }
            header {
                background: #222;
                padding: 15px;
                text-align: center;
                font-size: 20px;
                border-bottom: 1px solid #333;
            }
        </style>
    </head>
    <body>
        <header>RudeBot Web</header>

        <h1>RudeBot Web</h1>

        <div id="log"></div>
        <div id="input-container">
            <input id="msg" placeholder="Say something..." autocomplete="off">
        </div>
        <script>
            const backend = "https://rude-backend.onrender.com/chat";

            const log = document.getElementById("log");
            const msg = document.getElementById("msg");

            msg.addEventListener("keydown", async (e) => {
                if (e.key === "Enter") {
                    const text = msg.value.trim();
                    if (!text) return;

                    log.innerHTML += `
                    <div class="chat">
                        <div class="user-bubble">You: ${text}</div>
                    </div>`;
                    msg.value = "";

                    log.innerHTML += `<div id="typing" class="typing">Bot is typing...</div>`;
                    const res = await fetch(backend, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text })
                    });

                    const data = await res.json();
                    log.innerHTML += `
                    <div class="chat">
                        <div class="bot-bubble">Bot: ${data.reply}</div>
                    </div>`;
                    log.scrollTop = log.scrollHeight;

                    document.getElementById("typing").remove();
                }
            });
        </script>
    </body>
</html>
