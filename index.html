<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RudeBot Web</title>

        <style>
            body {
                background: linear-gradient(135deg, #4f1e1e, #ff7777);
                color:#eee;
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin: 0;
                padding: 40px 0;
            }


            #log {
                border: 1px solid #333;
                padding: 10px;
                padding-bottom: 80px;
                height: 300px;
                overflow-y: auto;
                background: #111;
                box-shadow: inset 0 0 15px rgba(255, 60, 0, 0.15);
            }
            .user { color: #4fc3f7; margin: 8px 0; }
            .bot { color: #f06292; margin: 8px 0; }
            input {
                width: 100%;
                padding: 14px;
                background: #222;
                color: #eee;
                border: 2px solid #ff3b00;
                border-radius: 8px;
                font-size: 16px;
                outline: none;
                box-shadow: 0 0 10px rgba(255, 60, 0, 0.3);
            }
            .chat {
                display: flex;
                margin: 10px 0;
                animation: fadeIn 0.25s ease-out;
            }
            .user-bubble {
                background: #ffcc00;
                color: #000;
                padding: 12px 16px;
                border-radius: 16px;
                max-width: 75%;
                margin-left: auto;
                font-size: 15px;
                box-shadow: 0 0 10px rgba(255, 200, 0, 0.4);
            }

            .bot-bubble {
                background: #ff3b3b;
                color: #000;
                padding: 12px 16px;
                border-radius: 16px;
                max-width: 75%;
                margin-right: auto;
                font-size: 15px;
                box-shadow: 0 0 10px rgba(255, 60, 0, 0.5);
            }
            .typing {
                color: #ff6a00;
                font-style: italic;
                margin: 5px 0;
            }
            #input-container {
                margin-top: 10px;
                width: 100%;
                max-width: 570px;
            }
            header {
                background: liner-gradient(90deg, #ff3b00, #ff6a00);
                color: #fff;
                padding: 20px;
                text-align: center;
                font-size: 24px;
                border-bottom: 1px solid #333;
                box-shadow: 0 2px 10px rgba(255, 80, 0, 0.4);
            }
            #chat-container {
                background: #1a1a1a;
                border-radius: 12px;
                box-shadow: 0 0 25px rgba(255, 60, 0, 0.25);
                padding: 20px;
                margin-top: 20px;
                height: 70vh;
                width: 75%;
                max-width: 75%;
                margin-left: auto;
                margin-right: auto;
                display: flex;
                flex-direction: column;
            }
            .chat {
                display: flex;
                margin: 10px 0;
                animation: fadeIn 0.25s ease-out;
            }



            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(4px); }
                to { opacity: 1; transform: translateY(0); }
            }
            #embers {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                pointer-events: none;
                overflow: hidden;
                z-index: -1;
            }
            .ember {
                position: absolute;
                width: 6px;
                height: 6px;
                background: radial-gradient(circle, #ff6a00, #ff4b00);
                border-radius: 50%;
                opacity: 0.8;
                animation: floatEmber  4s linear infinite;
                filter: blur(1px);
            }

            @keyframes floatEmber {
                0% {
                    transform: translateY(0) scale(1);
                    opacity: 0.9;
                }
                100% {
                    transform: translateY(-120px) scale(0.4);
                    opacity: 0;
                }
            }
        </style>
    </head>

    <body>

        <header>RudeBot Web</header>
        <div id="embers"></div>
        <div id="chat-container">

            <div id="log"></div>
            <div id="input-container">
                <input id="msg" placeholder="Say something..." autocomplete="off" autofocus>
            </div>
        </div>
        <script>
            const sessionId = crypto.randomUUID();
            const backend = "https://rude-backend.onrender.com/chat";

            const log = document.getElementById("log");
            const msg = document.getElementById("msg");
            const emberContainer = document.getElementById("embers");

            for (let i = 0; i < 60; i++) {
                const ember = document.createElement("div");
                ember.classList.add("ember");

                ember.style.left = Math.random() * 100 + "vw";
                ember.style.top = Math.random() * 100 + "vh";

                ember.style.animationDuration = (3 + Math.random() * 3) + "s";

                const size = 4 + Math.random() * 6;
                ember.style.width = size + "px";
                ember.style.height = size * "px";

                emberContainer.appendChild(ember);
            }

            msg.addEventListener("keydown", async (e) => {
                if (e.key === "Enter") {
                    const text = msg.value.trim();
                    if (!text) return;

                    log.innerHTML += `
                    <div class="chat">
                        <div class="user-bubble">${text}</div>
                    </div>`;
                    msg.value = "";

                    log.innerHTML += `<div id="typing" class="typing">Bot is typing...</div>`;
                    const res = await fetch(backend, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: text, session: sessionId })
                    });

                    const data = await res.json();
                    log.innerHTML += `
                    <div class="chat">
                        <div class="bot-bubble">${data.reply}</div>
                    </div>`;
                    log.scrollTop = log.scrollHeight;

                    document.getElementById("typing").remove();
                }
            });
        </script>
    </body>
</html>
